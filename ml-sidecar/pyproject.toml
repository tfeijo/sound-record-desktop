[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "meetnotes-ml"
version = "0.1.0"
description = "MeetNotes ML sidecar — Whisper transcription + speaker diarization"
requires-python = ">=3.10"
dependencies = [
    "faster-whisper>=1.0.0",
    "pydantic>=2.0.0",
    "soundfile>=0.12.0",
    "numpy>=1.26.0",
]

[project.optional-dependencies]
diarization = [
    "pyannote.audio>=3.1.0",
    "torch>=2.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
